name: helpdesk-prod

services:
  backend:
    image: helpdesk-backend:prod
    build: ./back-end
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/helpdesk
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: mongodb://mongodb:27017/helpdesk_attachments
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    image: helpdesk-frontend:prod
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_WEB_SERVER: ${NEXT_PUBLIC_WEB_SERVER}
        NEXT_PUBLIC_WEB_PORT_BACK_END: ${NEXT_PUBLIC_WEB_PORT_BACK_END}
    ports:
      - "3000:3000"
    depends_on:
      - backend
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  mongo_data: