
# ===============================
# APPLICATION
# ===============================
spring.application.name=back-end

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
spring.mvc.servlet.path=/api/v1

# ===============================
# MYSQL
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# MONGODB ATLAS
# ===============================
spring.mongodb.protocol=mongodb+srv
spring.mongodb.host=itsm-cluster.etfh9ms.mongodb.net
spring.mongodb.database=helpdesk_attachments
spring.mongodb.authentication-database=admin
spring.mongodb.username=${MONGO_USERNAME}
spring.mongodb.password=${MONGO_PASSWORD}
spring.mongodb.ssl.enabled=true

# ===============================
# FILE UPLOAD / MULTIPART
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

# ===============================
# COOKIE
# ===============================
app.cookie.secure=${COOKIE_SECURE:false}

# ===============================
# CORS
# ===============================
app.frontend-url=${FRONTEND_URL}

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
