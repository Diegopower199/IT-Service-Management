spring.application.name=back-end

# ===============================
# MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/helpdesk
spring.datasource.username=root
spring.datasource.password=diegopower
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# SERVER
# ===============================
server.port=8080

# Adds the /api/v1 prefix to all Spring MVC endpoints.
spring.mvc.servlet.path=/api/v1

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:1}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.cookie.secure=${COOKIE_SECURE:false}