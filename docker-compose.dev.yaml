name: helpdesk-dev

services:

  backend:
    image: helpdesk-backend:dev
    build:
      context: ./back-end
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/helpdesk
      DB_USERNAME: ${DEV_DB_USERNAME}
      DB_PASSWORD: ${DEV_DB_PASSWORD}
      MONGODB_URI: mongodb://mongodb:27017/helpdesk_attachments
      JWT_SECRET: ${DEV_JWT_SECRET}
      FRONTEND_URL: ${DEV_FRONTEND_URL}
    develop:
      watch:
        - action: restart
          path: ./back-end/src
        - action: restart
          path: ./back-end/pom.xml
    volumes:
      - ./back-end:/app
      - backend_target:/app/target
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    image: helpdesk-frontend:dev
    build:
      context: ./front-end
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_WEB_SERVER: ${DEV_NEXT_PUBLIC_WEB_SERVER}
      NEXT_PUBLIC_WEB_PORT_BACK_END: ${DEV_NEXT_PUBLIC_WEB_PORT_BACK_END}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front-end:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: ${DEV_DB_USERNAME}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  mongo_data:
  backend_target:
  maven_cache:
  frontend_node_modules:
  frontend_next: